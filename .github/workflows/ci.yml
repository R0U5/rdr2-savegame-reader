name: ci

on:
  push:
    branches: [master, main, 'story/**']
  pull_request:

jobs:
  build-test:
    name: .NET build + tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build Rdr2SaveResearch.slnx -c Release

      - name: Run self-tests
        run: dotnet run --project tests/Rdr2SaveResearch.SelfTest -c Release

      - name: Validate no uncommitted changes
        run: |
          git status --porcelain
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then echo "Working tree dirty: $dirty"; exit 1; fi